name: Windows Release

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run PowerShell tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $testResult = Invoke-Pester .\installer\windows\tests,.\tests -PassThru
          if ($testResult.FailedCount -gt 0) { exit 1 }

      - name: Build release artifacts
        shell: powershell
        run: |
          .\scripts\Build-RwcaRelease.ps1

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-with-coding-agents-windows
          path: dist\

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
