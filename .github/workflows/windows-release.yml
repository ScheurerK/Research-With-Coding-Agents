name: Windows Release

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch prebuilt markplane.exe
        shell: powershell
        env:
          MARKPLANE_VERSION: v0.1.2
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "markplane-$env:MARKPLANE_VERSION-x86_64-pc-windows-msvc.zip"
          $baseUrl = "https://github.com/zerowand01/markplane/releases/download/$env:MARKPLANE_VERSION"
          $work = Join-Path $env:RUNNER_TEMP "markplane-fetch"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zipPath = Join-Path $work $zipName
          $checksumsPath = Join-Path $work "checksums-sha256.txt"

          Invoke-WebRequest -Uri "$baseUrl/$zipName" -OutFile $zipPath -UseBasicParsing
          Invoke-WebRequest -Uri "$baseUrl/checksums-sha256.txt" -OutFile $checksumsPath -UseBasicParsing

          $expectedLine = Get-Content $checksumsPath | Where-Object { $_ -match [regex]::Escape($zipName) }
          if (-not $expectedLine) {
            throw "No checksum entry found for $zipName"
          }
          $expectedHash = ($expectedLine -split '\s+')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash
          if ($actualHash -ine $expectedHash) {
            throw "Checksum mismatch for $zipName. Expected $expectedHash, got $actualHash."
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $work -Force
          Copy-Item -LiteralPath (Join-Path $work "markplane.exe") -Destination "installer\windows\markplane.exe" -Force
          Write-Host "Fetched and verified markplane.exe $env:MARKPLANE_VERSION"

      - name: Run PowerShell tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $testResult = Invoke-Pester .\installer\windows\tests,.\tests -PassThru
          if ($testResult.FailedCount -gt 0) { exit 1 }

      - name: Build release artifacts
        shell: powershell
        run: |
          .\scripts\Build-RwcaRelease.ps1

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-with-coding-agents-windows
          path: dist\

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
