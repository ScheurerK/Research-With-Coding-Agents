name: Windows Release

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run PowerShell tests
        shell: powershell
        run: |
          Invoke-Pester .\installer\windows\tests,.\tests

      - name: Build release artifacts
        shell: powershell
        run: |
          .\scripts\Build-RwcaRelease.ps1

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-with-coding-agents-windows
          path: dist\