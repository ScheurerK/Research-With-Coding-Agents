name: Windows Release

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: components/markplane/crates/markplane-web/ui/package-lock.json

      - name: Build Markplane web UI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location components\markplane\crates\markplane-web\ui
          npm ci
          npm run build
          Pop-Location

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: components/markplane -> target

      - name: Build markplane.exe from vendored source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          rustup update stable
          rustup default stable
          Push-Location components\markplane
          cargo build --release --features embed-ui -p markplane-cli
          Pop-Location
          Copy-Item -LiteralPath "components\markplane\target\release\markplane.exe" -Destination "installer\windows\markplane.exe" -Force
          Write-Host "Built markplane.exe with embedded web UI from components\markplane"

      - name: Run PowerShell tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $testResult = Invoke-Pester .\installer\windows\tests,.\tests -PassThru
          if ($testResult.FailedCount -gt 0) { exit 1 }

      - name: Build release artifacts
        shell: powershell
        run: |
          .\scripts\Build-RwcaRelease.ps1

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: research-with-coding-agents-windows
          path: dist\

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
