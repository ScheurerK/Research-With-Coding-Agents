name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hygiene:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate public repository envelope
        shell: powershell
        run: |
          .\scripts\Test-RwcaDistributionReadiness.ps1
          if (-not (Test-Path .\THIRD_PARTY_NOTICES.md)) { throw "THIRD_PARTY_NOTICES.md missing" }

      - name: Run public repository tests
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $testResult = Invoke-Pester .\tests -PassThru
          if ($testResult.FailedCount -gt 0) { exit 1 }
